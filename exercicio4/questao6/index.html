<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel com cartao</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="painel">

    <div class="card destaque">
        <h3>Notícia Principal</h3>
        <p>Esta é a notícia de maior destaque do painel.</p>
    </div>

    <div class="card esportes">
        <h3>Maquiagens</h3>
        <p>Confira as principais marcas de cosmesticos em alta.</p>

    <div class="card tecnologia">
        <h3>Moda</h3>
        <p>Novidades e collections sobre alta costura.</p>
    </div>

    <div class="card cultura">
        <h3>Cultura</h3>
        <p>Veja as principais receitas sobre cada cultura.</p>
    </div>
</div>
